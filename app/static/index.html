<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>周期变星候选筛选 · Lomb–Scargle</title>
<style>
  :root { --blue:#1f5fa8; --red:#c0392b; --green:#1e8449; --gray:#666; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
         background:#f4f6f9; color:#222; }
  header { background:linear-gradient(135deg,#163a5f,#1f5fa8); color:#fff;
           padding:22px 28px; }
  header h1 { margin:0 0 6px; font-size:22px; }
  header p { margin:0; font-size:13px; opacity:.88; max-width:900px; line-height:1.6; }
  main { max-width:1080px; margin:22px auto; padding:0 16px 40px; }
  .card { background:#fff; border:1px solid #e2e7ee; border-radius:10px;
          padding:18px 20px; margin-bottom:18px; box-shadow:0 1px 3px rgba(20,40,70,.06); }
  .card h2 { margin:0 0 14px; font-size:16px; color:#163a5f; }
  form { display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; }
  label { display:flex; flex-direction:column; font-size:13px; color:#444; gap:4px; }
  input[type=file], input[type=number] { padding:7px 9px; border:1px solid #c9d2de;
    border-radius:6px; font-size:13px; background:#fbfcfe; }
  input[type=number] { width:130px; }
  button { padding:8px 16px; border:0; border-radius:6px; font-size:13px;
           cursor:pointer; background:var(--blue); color:#fff; }
  button.secondary { background:#5d6d7e; }
  button.danger { background:var(--red); }
  button:disabled { background:#aab4c0; cursor:not-allowed; }
  .hint { font-size:12px; color:var(--gray); margin:10px 0 0; line-height:1.7; }
  #msg { margin-top:10px; font-size:13px; min-height:18px; }
  #msg.err { color:var(--red); } #msg.ok { color:var(--green); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid #edf0f5; }
  th { color:#556; font-weight:600; background:#f8fafc; }
  .badge { display:inline-block; padding:2px 10px; border-radius:12px;
           font-size:12px; color:#fff; }
  .st-running   { background:#b9770e; }
  .st-done      { background:var(--green); }
  .st-failed    { background:var(--red); }
  .st-cancelled { background:#5d6d7e; }
  .mono { font-family:ui-monospace,Consolas,monospace; }
  #slots { font-size:12px; color:var(--gray); margin-bottom:8px; }
  .metrics { display:flex; flex-wrap:wrap; gap:14px; margin:6px 0 14px; }
  .metric { background:#f4f8fd; border:1px solid #dbe7f5; border-radius:8px;
            padding:10px 16px; min-width:150px; }
  .metric .k { font-size:12px; color:var(--gray); }
  .metric .v { font-size:18px; font-weight:600; color:#163a5f; margin-top:2px; }
  .plots { display:flex; flex-wrap:wrap; gap:16px; }
  .plots figure { margin:0; }
  .plots img { max-width:100%; border:1px solid #e2e7ee; border-radius:8px; }
  .plots figcaption { font-size:12px; color:var(--gray); text-align:center;
                      margin-top:4px; }
  .errbox { background:#fdf0ee; border:1px solid #f2c7c0; color:#8f2d20;
            border-radius:8px; padding:10px 14px; font-size:13px;
            white-space:pre-wrap; }
  .row-actions button { margin-right:6px; padding:5px 10px; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>周期变星候选筛选</h1>
  <p>上传单颗星的测光序列(CSV,含 time_day、flux 两列),系统以带浮动均值的
     Lomb–Scargle 周期图在指定周期范围内搜索信号,展示最高峰周期、功率谱与
     相位折叠散点,并通过 200 次通量置换估计尾概率,供人工复核。</p>
</header>
<main>
  <section class="card">
    <h2>提交新批</h2>
    <form id="submitForm">
      <label>测光 CSV 文件
        <input type="file" name="file" accept=".csv,text/csv" required>
      </label>
      <label>周期下限(天)
        <input type="number" name="period_min" step="any" min="0" value="2" required>
      </label>
      <label>周期上限(天)
        <input type="number" name="period_max" step="any" min="0" value="10" required>
      </label>
      <button type="submit">提交计算</button>
      <button type="button" class="secondary" id="sampleBtn">载入虚构样例并提交</button>
    </form>
    <div id="msg"></div>
    <p class="hint">要求:至少 10 行;time_day、flux 均为有限数值;观测时刻互异;
       0 &lt; 周期下限 &lt; 周期上限。频率范围取周期范围的倒数,均匀取 10000 点。
       每批使用两个计算子进程,最多两批并行,超额将被拒绝(HTTP 429)。</p>
  </section>

  <section class="card">
    <h2>批处理列表</h2>
    <div id="slots"></div>
    <table>
      <thead><tr>
        <th>ID</th><th>文件</th><th>行数</th><th>周期范围(天)</th>
        <th>提交时间</th><th>状态</th><th>操作</th>
      </tr></thead>
      <tbody id="jobRows"><tr><td colspan="7">暂无批处理</td></tr></tbody>
    </table>
  </section>

  <section class="card" id="detailCard" hidden>
    <h2>批处理详情 <span class="mono" id="dId"></span></h2>
    <div id="dBody"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g,
  (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let selectedJob = null;
let lastDetailSig = null;

function showMsg(text, ok) {
  const m = $("msg");
  m.textContent = text;
  m.className = ok ? "ok" : "err";
}

async function parseError(resp) {
  try {
    const j = await resp.json();
    return j.detail || ("HTTP " + resp.status);
  } catch (e) { return "HTTP " + resp.status; }
}

async function submitFormData(fd) {
  const resp = await fetch("/api/jobs", { method: "POST", body: fd });
  if (!resp.ok) { showMsg("提交失败:" + await parseError(resp), false); return; }
  const j = await resp.json();
  showMsg("已受理,批号 " + j.job_id, true);
  selectedJob = j.job_id;
  refresh();
}

$("submitForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const fd = new FormData(ev.target);
  await submitFormData(fd);
});

$("sampleBtn").addEventListener("click", async () => {
  try {
    const r = await fetch("/api/sample.csv");
    if (!r.ok) { showMsg("样例获取失败", false); return; }
    const blob = await r.blob();
    const fd = new FormData();
    fd.append("file", new File([blob], "sample_star.csv", { type: "text/csv" }));
    fd.append("period_min", "2");
    fd.append("period_max", "10");
    await submitFormData(fd);
  } catch (e) { showMsg("样例提交失败:" + e, false); }
});

function fmtTime(ts) {
  return ts ? new Date(ts * 1000).toLocaleString() : "—";
}
const STATE_TEXT = { running: "计算中", done: "成功", failed: "失败",
                     cancelled: "已取消" };

async function refresh() {
  let data;
  try { data = await (await fetch("/api/jobs")).json(); }
  catch (e) { return; }
  $("slots").textContent =
    `并行名额:${data.running}/${data.max_parallel} 占用中`;
  const tbody = $("jobRows");
  if (!data.jobs.length) {
    tbody.innerHTML = '<tr><td colspan="7">暂无批处理</td></tr>';
  } else {
    tbody.innerHTML = "";
    for (const j of data.jobs) {
      const tr = document.createElement("tr");
      const canCancel = j.state === "running";
      tr.innerHTML =
        `<td class="mono">${j.job_id}</td>` +
        `<td>${esc(j.filename)}</td>` +
        `<td>${j.n_rows}</td>` +
        `<td>${j.period_min} ~ ${j.period_max}</td>` +
        `<td>${fmtTime(j.created_at)}</td>` +
        `<td><span class="badge st-${j.state}">${STATE_TEXT[j.state] || j.state}</span></td>`;
      const td = document.createElement("td");
      td.className = "row-actions";
      const viewBtn = document.createElement("button");
      viewBtn.textContent = "查看";
      viewBtn.onclick = () => { selectedJob = j.job_id; lastDetailSig = null;
                                renderDetail(); };
      td.appendChild(viewBtn);
      if (canCancel) {
        const cBtn = document.createElement("button");
        cBtn.textContent = "取消";
        cBtn.className = "danger";
        cBtn.onclick = () => cancelJob(j.job_id);
        td.appendChild(cBtn);
      }
      tr.appendChild(td);
      tbody.appendChild(tr);
    }
  }
  if (selectedJob) renderDetail();
}

async function cancelJob(id) {
  const resp = await fetch(`/api/jobs/${id}/cancel`, { method: "POST" });
  const j = await resp.json();
  if (resp.ok) showMsg(`批 ${id}:${j.detail || j.state}`, true);
  else showMsg(`取消失败:${j.detail || resp.status}`, false);
  refresh();
}

async function renderDetail() {
  const card = $("detailCard");
  let j;
  try {
    const resp = await fetch(`/api/jobs/${selectedJob}`);
    if (!resp.ok) { card.hidden = true; selectedJob = null; return; }
    j = await resp.json();
  } catch (e) { return; }
  const sig = j.job_id + "|" + j.state + "|" + (j.finished_at || "");
  if (sig === lastDetailSig) return;   // 状态未变,避免图片反复重载
  lastDetailSig = sig;
  card.hidden = false;
  $("dId").textContent = j.job_id;
  const body = $("dBody");
  let html =
    `<p class="hint">状态:${STATE_TEXT[j.state] || j.state} · ` +
    `文件:${esc(j.filename)} · 行数:${j.n_rows} · ` +
    `周期范围:${j.period_min} ~ ${j.period_max} 天 · ` +
    `提交:${fmtTime(j.created_at)}` +
    (j.finished_at ? ` · 终结:${fmtTime(j.finished_at)}` : "") + `</p>`;
  if (j.state === "done" && j.metrics) {
    const m = j.metrics;
    html +=
      `<div class="metrics">` +
      `<div class="metric"><div class="k">最高峰周期</div>` +
      `<div class="v">${m.best_period.toPrecision(7)} 天</div></div>` +
      `<div class="metric"><div class="k">峰值功率</div>` +
      `<div class="v">${m.max_power.toPrecision(6)}</div></div>` +
      `<div class="metric"><div class="k">置换尾概率</div>` +
      `<div class="v">${m.tail_prob.toPrecision(4)}</div></div>` +
      `<div class="metric"><div class="k">≥原峰的置换次数</div>` +
      `<div class="v">${m.n_perm_ge} / ${m.n_perm}</div></div>` +
      `</div>` +
      `<div class="plots">` +
      `<figure><img src="/api/jobs/${j.job_id}/plot/power.png?${Date.now()}">` +
      `<figcaption>功率谱(10000 个频率点)</figcaption></figure>` +
      `<figure><img src="/api/jobs/${j.job_id}/plot/phase.png?${Date.now()}">` +
      `<figcaption>按最高峰周期折叠的相位散点</figcaption></figure>` +
      `</div>`;
  } else if (j.state === "failed") {
    html += `<div class="errbox">${esc(j.error || "未知错误")}</div>`;
  } else if (j.state === "cancelled") {
    html += `<p class="hint">该批已被取消,子进程已退出、临时文件已清理,名额已释放。</p>`;
  } else {
    html += `<p class="hint">正在计算,请稍候……(每批两个计算子进程)</p>`;
  }
  body.innerHTML = html;
}

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
